<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Training - 智能数据分析助手</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧 Trace 面板 -->
        <div class="trace-panel">
            <div class="panel-header">
                <h2>Trace / 思维链</h2>
            </div>
            <div class="panel-content" id="trace-content">
                <!-- Trace 步骤会动态添加到这里 -->
            </div>
        </div>

        <!-- 右侧聊天面板 -->
        <div class="chat-panel">
            <div class="chat-header">
                <h1>AI Agent Training</h1>
                <p>基于 ReAct 架构的智能数据分析助手</p>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <h3>欢迎使用 AI Agent</h3>
                    <p>基于 ReAct 架构的智能数据分析助手</p>
                    <p>请在下方输入您的问题</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea
                        id="message-input"
                        placeholder="输入您的问题，按 Enter 发送..."
                        rows="1"
                    ></textarea>
                    <button id="send-button" class="btn btn-primary">发送</button>
                    <button id="clear-button" class="btn btn-secondary">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
